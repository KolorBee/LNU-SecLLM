# Example only. Do not replace the current Nav2 params until terrain_mapping has
# been tested in dry-run. This snippet shows how /terrain_obstacle_cloud can be
# added as an extra local obstacle source.
local_costmap:
  local_costmap:
    ros__parameters:
      plugins: ["obstacle_layer", "terrain_obstacle_layer", "inflation_layer"]

      terrain_obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: terrain_cloud
        terrain_cloud:
          topic: "/terrain_obstacle_cloud"
          data_type: "PointCloud2"
          expected_update_rate: 2.0
          observation_persistence: 0.4
          marking: true
          clearing: false
          obstacle_range: 5.0
          raytrace_range: 0.0
          min_obstacle_height: -0.20
          max_obstacle_height: 1.50

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.35
        cost_scaling_factor: 3.0
