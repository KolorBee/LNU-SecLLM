lidar:
  - driver:
      use_gpu: false
      source_type: 1
      lidar_udp_type:
        device_ip_address: 192.168.1.201
        udp_port: 2368
        ptc_port: 9347
        multicast_ip_address: ""

        use_ptc_connected: true
        host_ptc_port: 0
        correction_file_path: "/home/star/unitree-go2-fan/src/HesaiLidar_ROS_2.0/src/driver/HesaiLidar_SDK_2.0/correction/angle_correction/JT128_Angle Correction File.csv"
        firetimes_path: "/home/star/unitree-go2-fan/src/HesaiLidar_ROS_2.0/src/driver/HesaiLidar_SDK_2.0/correction/firetime_correction/JT128_Firetime Correction File.csv"

        recv_point_cloud_timeout: -1
        ptc_connect_timeout: -1
        host_ip_address: ""
        fault_message_port: 0

        standby_mode: -1
        # Keep LiDAR spin speed unchanged by default. A live test of 600 RPM
        # returned "set speed failed" on this JT128/PTC setup.
        speed: -1
        ptc_mode: 0
        certFile: ""
        privateKeyFile: ""
        caFile: ""

      pcap_type:
        pcap_path: ""
        correction_file_path: "/home/star/unitree-go2-fan/src/HesaiLidar_ROS_2.0/src/driver/HesaiLidar_SDK_2.0/correction/angle_correction/JT128_Angle Correction File.csv"
        firetimes_path: "/home/star/unitree-go2-fan/src/HesaiLidar_ROS_2.0/src/driver/HesaiLidar_SDK_2.0/correction/firetime_correction/JT128_Firetime Correction File.csv"
        pcap_play_synchronization: true
        pcap_play_in_loop: false
        play_rate_: 1.0

      rosbag_type:
        correction_file_path: "/home/star/unitree-go2-fan/src/HesaiLidar_ROS_2.0/src/driver/HesaiLidar_SDK_2.0/correction/angle_correction/JT128_Angle Correction File.csv"
        firetimes_path: "/home/star/unitree-go2-fan/src/HesaiLidar_ROS_2.0/src/driver/HesaiLidar_SDK_2.0/correction/firetime_correction/JT128_Firetime Correction File.csv"

      serial_type:
        rs485_com: ""
        rs232_com: ""
        point_cloud_baudrate: 3125000
        correction_save_path: ""
        correction_file_path: "/home/star/unitree-go2-fan/src/HesaiLidar_ROS_2.0/src/driver/HesaiLidar_SDK_2.0/correction/angle_correction/JT128_Angle Correction File.csv"

      use_timestamp_type: 1
      frame_start_azimuth: 0
      thread_num: 4

      transform_flag: false
      x: 0
      y: 0
      z: 0
      roll: 0
      pitch: 0
      yaw: 0

      fov_start: -1
      fov_end: -1
      channel_fov_filter_path: ""
      # Keep full horizontal FOV for ICP odometry. Driver-level front-only
      # cropping can make scan matching lose odom->base_link TF.
      multi_fov_filter_ranges: ""

      enable_packet_loss_tool: false
      distance_correction_flag: false
      xt_spot_correction: false
      device_udp_src_port: 0
      device_fault_port: 0
      # Keep driver frame dropping disabled. Reduce points per frame instead.
      frame_frequency: 0
      default_frame_frequency: 10.0
      echo_mode_filter: 0

    ros:
      ros_frame_id: hesai_lidar
      ros_recv_packet_topic: /lidar_packets
      ros_send_packet_topic: /lidar_packets
      ros_send_point_cloud_topic: /lidar_points
      ros_send_imu_topic: /lidar_imu
      ros_send_packet_loss_topic: "your topic name"
      # Keep LiDAR frame rate high and reduce per-frame point count early.
      # Historical stable default: 2. Use 3/4 only for low-power deployment.
      ros_point_stride: 2
      send_packet_ros: false
      send_point_cloud_ros: true
      send_imu_ros: true
