name: "hashcat"
command: "hashcat"
enabled: true
short_description: "高级密码破解工具，支持GPU加速"
description: |
  Hashcat是一个高级密码恢复工具，支持多种哈希算法、攻击模式。
  主要功能：支持多种哈希算法、CPU/GPU加速、字典/掩码攻击。
  使用场景：安全测试、密码审计、哈希破解。

parameters:
  - name: "hash_file"
    type: "string"
    description: "包含哈希的文件"
    required: true
    position: 0
    format: "positional"
  - name: "wordlist"
    type: "string"
    description: "字典文件"
    required: false
    default: "/usr/share/wordlists/rockyou.txt"
    position: 1
    format: "positional"
  - name: "hash_type"
    type: "string"
    description: "哈希类型编号(0=MD5)"
    required: true
    default: "0"
    flag: "-m"
    format: "flag"
  - name: "attack_mode"
    type: "string"
    description: "攻击模式（0=字典）"
    required: false
    default: "0"
    flag: "-a"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: "额外参数"
    required: false
    default: "--show"
    format: "flag"
